function csv(all){let keys=['protocol','date','time','front','type','name','role','team','location','status','notes'];let fieldKeys=[...new Set(all.flatMap(x=>Object.keys(x.fields)))];let head=[...keys,...fieldKeys,'fotos','assinatura_apontador','assinatura_chefe'];let data=[head,...all.map(d=>[...keys.map(k=>d[k]??''),...fieldKeys.map(k=>k==='insumos'?Object.entries(d.fields.insumos||{}).map(([id,x])=>(id==='outro'?(x.name||'Outro material'):(INSUMOS.find(i=>i[0]===id)?.[1]||id))+': '+x.qty+' '+x.unit).join(' | '):(d.fields[k]??'')),d.photos.length,d.signatures.apontador?.name||'',d.signatures.chefe?.name||''])];return '\ufeff'+data.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n')}
function downloadPhoto(photo,index,prefix){const a=document.createElement('a');a.href=photo.data;a.download=(prefix||'SIGA')+'_foto_'+String(index+1).padStart(2,'0')+'.jpg';document.body.append(a);a.click();a.remove()}
function zipBytes(files){
 const encoder=new TextEncoder(), parts=[],central=[];let offset=0;
 const table=zipBytes.table||(zipBytes.table=Array.from({length:256},(_,n)=>{let c=n;for(let j=0;j<8;j++)c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0}));
 const crc32=bytes=>{let c=0xffffffff;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xffffffff)>>>0};
 const u16=(v,o,n)=>v.setUint16(o,n,true),u32=(v,o,n)=>v.setUint32(o,n>>>0,true);
 for(const f of files){const name=encoder.encode(f.name),data=f.data,crc=crc32(data),local=new Uint8Array(30+name.length),v=new DataView(local.buffer);u32(v,0,0x04034b50);u16(v,4,20);u16(v,6,0x0800);u16(v,8,0);u32(v,14,crc);u32(v,18,data.length);u32(v,22,data.length);u16(v,26,name.length);local.set(name,30);parts.push(local,data);
 const entry=new Uint8Array(46+name.length),e=new DataView(entry.buffer);u32(e,0,0x02014b50);u16(e,4,20);u16(e,6,20);u16(e,8,0x0800);u32(e,16,crc);u32(e,20,data.length);u32(e,24,data.length);u16(e,28,name.length);u32(e,42,offset);entry.set(name,46);central.push(entry);offset+=local.length+data.length;}
 const centralSize=central.reduce((n,e)=>n+e.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);u32(v,0,0x06054b50);u16(v,8,files.length);u16(v,10,files.length);u32(v,12,centralSize);u32(v,16,offset);return new Blob([...parts,...central,end],{type:'application/zip'});
}
function downloadPhotosZip(record){if(!record.photos?.length){toast('Esta ficha não possui fotografias.');return}try{const encoder=new TextEncoder();const files=record.photos.map((p,i)=>{const raw=p.data.split(',')[1],binary=atob(raw),bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return {name:'foto_'+String(i+1).padStart(2,'0')+'.jpg',data:bytes}});files.push({name:'legendas.txt',data:encoder.encode(record.photos.map((p,i)=>'Foto '+(i+1)+' — '+(p.caption||p.name||'Sem legenda')).join('\r\n'))});const blob=zipBytes(files),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=(record.protocol||record.id||'SIGA_Matapi')+'_fotografias.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Pacote ZIP das fotografias preparado.')}catch(err){toast('Falha ao gerar ZIP: '+err.message)}}
function download(content,name,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function bindRecords(){let all=await getAll('records');$('#export').onclick=()=>download(csv(all),'SIGA_Matapi_Registros.csv','text/csv;charset=utf-8');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>showRecord(b.dataset.view));document.querySelectorAll('[data-resume]').forEach(b=>b.onclick=async()=>{draft=await tx('drafts','readonly',o=>o.get(b.dataset.resume));step=0;nav('form')});let update=()=>{let q=document.querySelector('[data-key="filter"]').value.toLowerCase(),s=document.querySelector('[data-key="filterStatus"]').value;document.querySelectorAll('#rows tr[data-search]').forEach(tr=>tr.style.display=(tr.dataset.search.includes(q)&&(s==='Todas'||tr.dataset.status===s))?'':'none')};document.querySelectorAll('[data-key]').forEach(x=>x.addEventListener('input',update))}
async function showRecord(id){let d=await tx('records','readonly',o=>o.get(id));if(!d)return;page='detail';window.currentRecord=d;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow">Registro local</div><h1 class="title">${esc(d.protocol)}</h1></div><span class="pill">${esc(d.status)}</span></div><div class="card"><h3>${esc(d.front)} — ${esc(d.type)}</h3><div class="review">${[['Data',d.date+' '+d.time],['Apontador',d.name],['Função',d.role],['Equipe',d.team],['Local',d.location],...Object.entries(d.fields).map(([k,v])=>[k==='insumos'?'Insumos consumidos':labelOf(k),k==='insumos'?Object.entries(v||{}).map(([id,x])=>(id==='outro'?(x.name||'Outro material'):(INSUMOS.find(i=>i[0]===id)?.[1]||id))+': '+(x.qty||'não informado')+' '+x.unit).join('; '):v]),['Observações',d.notes],['Confirmado em',new Date(d.submittedAt).toLocaleString('pt-BR')]].map(([k,v])=>`<div><b>${esc(k)}</b>${esc(v||'—')}</div>`).join('')}</div><div class="row"><h3>Fotografias (${d.photos.length})</h3><button class="btn small secondary no-print" id="downloadAllPhotos" ${d.photos.length?"":"disabled"}>↓ Baixar todas (.zip)</button></div><div class="photos">${d.photos.map(p=>`<div class="photo"><img src="${p.data}"><small>${esc(p.caption||p.name)}</small><button class="btn small secondary no-print" data-photo-download="${d.photos.indexOf(p)}">↓ Baixar</button></div>`).join('')||'Nenhuma'}</div><h3>Assinaturas</h3><div class="signs">${['apontador','chefe'].map(w=>`<div class="sign"><b>${w==='chefe'?'Chefe de campo':'Apontador'}</b><p>${esc(d.signatures[w]?.name)}</p><img style="width:100%;max-height:140px;object-fit:contain" src="${d.signatures[w]?.data||''}"><small>${esc(d.signatures[w]?.at?new Date(d.signatures[w].at).toLocaleString('pt-BR'):'')}</small></div>`).join('')}</div><div class="divider"></div><h3>Histórico</h3>${d.history.map(h=>`<p class="hint">${esc(new Date(h.at).toLocaleString('pt-BR'))} — ${esc(h.action)}</p>`).join('')}<div class="actions no-print"><button class="btn secondary" id="return">← Voltar</button><button class="btn secondary" id="print">Imprimir / salvar PDF</button><button class="btn secondary" id="json">Backup JSON</button><button class="btn warn" id="pend">Marcar pendente</button><button class="btn" id="valid">Validar localmente</button></div></div><p class="hint">PDF gerado pela função de impressão do navegador. Confirmação e protocolo são locais, não certificados.</p>`;$('#downloadAllPhotos').onclick=()=>downloadPhotosZip(d);document.querySelectorAll('[data-photo-download]').forEach(b=>b.onclick=()=>downloadPhoto(d.photos[+b.dataset.photoDownload],+b.dataset.photoDownload,d.protocol));$('#return').onclick=()=>nav('records');$('#print').onclick=()=>window.print();$('#json').onclick=()=>download(JSON.stringify(d,null,2),d.protocol+'.json','application/json');for(let [key,status] of [['pend','Pendente'],['valid','Validada']])$('#'+key).onclick=async()=>{d.status=status;d.syncState='pendente';d.history.push({at:now(),action:'Situação alterada localmente para '+status});await put('records',d);showRecord(d.id);toast('Situação atualizada somente neste aparelho')}}
async function render(){network();if(page==='home'){$('#app').innerHTML=home();let r=await getAll('records'),d=await getAll('drafts');$('#countR').textContent=r.length;renderSyncArea();$('#countD').textContent=d.length;$('#countP').textContent=r.filter(x=>x.status==='Aguardando conferência').length;document.querySelectorAll('[data-front]').forEach(e=>e.onclick=()=>{draft=blank(e.dataset.front);step=0;nav('form')})}else if(page==='form'){if(!draft)draft=blank();$('#app').innerHTML=form();bindForm()}else if(page==='records'||page==='admin'){$('#app').innerHTML=await records(page==='admin');await bindRecords()}}

function renderSyncArea(){const el=$('#syncArea');if(!el)return;el.innerHTML=`<h3>Sincronização de teste • Supabase</h3><p class="hint">Somente fichas fictícias. A sincronização é manual; o estado "Validada" é local e não equivale à aprovação pela Seção.</p>${sigaSession?`<p class="hint">Conectado como ${esc(sigaSession.user?.email||'usuário de teste')}.</p><button class="btn" id="sigaSync">Enviar fichas pendentes</button> <button class="btn secondary" id="sigaLogout">Sair</button><p class="hint" id="sigaSyncMsg"></p>`:`<div class="fields"><div class="field"><label>E-mail da conta de teste</label><input type="email" id="sigaEmail" autocomplete="username"></div><div class="field"><label>Senha</label><input type="password" id="sigaPassword" autocomplete="current-password"></div></div><p><button class="btn" id="sigaLogin">Entrar para sincronizar</button></p><p class="hint" id="sigaSyncMsg"></p>`}`;

async function sigaLogin(){if(!navigator.onLine){toast('Conecte-se à internet para entrar');return}let email=$('#sigaEmail').value.trim(),password=$('#sigaPassword').value;if(!email||!password){toast('Informe e-mail e senha');return}let btn=$('#sigaLogin');btn.disabled=true;try{let r=await fetch(SIGA_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:sigaHeaders(),body:JSON.stringify({email,password})});let j=await r.json();if(!r.ok)throw Error(j.error_description||j.msg||j.error||'Falha de autenticação');sigaSession=j;renderSyncArea();toast('Login de teste realizado')}catch(e){toast('Login: '+e.message)}finally{if(btn.isConnected)btn.disabled=false}}
async function sigaSync(){if(sigaBusy)return;if(!navigator.onLine){toast('Sem conexão com a internet');return}if(!sigaSession?.access_token){toast('Entre novamente');return}const records=await getAll('records');const pending=records.filter(d=>d.syncState!=='enviado');if(!pending.length){toast('Nenhuma ficha pendente neste aparelho');return}if(!confirm('Enviar '+pending.length+' ficha(s) locais para o banco de TESTE? Envie somente dados fictícios.'))return;sigaBusy=true;let ok=0,fail=0;const msg=$('#sigaSyncMsg');try{for(const d of pending){if(msg)msg.textContent=`Enviando ${ok+fail+1} de ${pending.length}...`;try{let r=await fetch(SIGA_URL+'/rest/v1/apontamentos?on_conflict=protocolo',{method:'POST',headers:{...sigaHeaders(sigaSession.access_token),'Prefer':'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify({protocolo:d.protocol||d.id,apontador_id:sigaSession.user.id,dados:d,situacao:'pendente'})});if(!r.ok){let t=await r.text();throw Error('HTTP '+r.status+': '+t.slice(0,140))}d.syncState='enviado';d.syncedAt=now();d.syncedBy=sigaSession.user.id;await put('records',d);ok++}catch(e){fail++;if(msg)msg.textContent='Erro no envio: '+e.message}}if(msg)msg.textContent=`Confirmados pelo servidor: ${ok}. Pendentes ou com erro: ${fail}.`;toast(`Envio concluído: ${ok} recebido(s), ${fail} pendente(s).`)}finally{sigaBusy=false}}
